<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <!-- Dumbbell Top -->
  <!-- Center Bar -->
  <rect x="190" y="65" width="120" height="14" rx="7" fill="#FF6B00"/>
  <!-- Left Weight Outer Plate -->
  <rect x="125" y="45" width="28" height="54" rx="10" fill="#FF6B00"/>
  <!-- Left Weight Inner Plate -->
  <rect x="157" y="52" width="20" height="40" rx="7" fill="#FF6B00"/>
  <!-- Right Weight Inner Plate -->
  <rect x="323" y="52" width="20" height="40" rx="7" fill="#FF6B00"/>
  <!-- Right Weight Outer Plate -->
  <rect x="347" y="45" width="28" height="54" rx="10" fill="#FF6B00"/>

  <!-- Straw (passes through dumbbell into cup) -->
  <path d="M280 15 L252 230" stroke="#FF6B00" stroke-width="22" stroke-linecap="round"/>

  <!-- Smoothie Cup Dome Lid -->
  <path d="M170 160 C170 110, 330 110, 330 160 Z" fill="none" stroke="#00E5FF" stroke-width="16" stroke-linejoin="round"/>
  <rect x="155" y="155" width="190" height="24" rx="12" fill="#00E5FF"/>

  <!-- Smoothie Cup Body -->
  <path d="M172 175 L198 370 C202 395, 225 410, 250 410 C275 410, 298 395, 302 370 L328 175" fill="none" stroke="#00E5FF" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Smoothie Liquid Fill -->
  <path d="M185 235 Q 250 215, 315 235 L 300 365 Q 250 395, 200 365 Z" fill="#FF6B00"/>

  <!-- Blue Liquid Drips at Bottom -->
  <circle cx="225" cy="425" r="9" fill="#00E5FF"/>
  <circle cx="245" cy="440" r="11" fill="#00E5FF"/>
  <circle cx="270" cy="420" r="8" fill="#00E5FF"/>

  <!-- Text Lockup -->
  <!-- FROST (Thick Blue Condensed) -->
  <text x="250" y="490" font-family="'Outfit', 'Impact', sans-serif" font-weight="900" font-size="64" fill="#00E5FF" text-anchor="middle" letter-spacing="4">FROST</text>
  <!-- & FITNESS (Wide Orange) -->
  <text x="250" y="530" font-family="'Outfit', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#FF6B00" text-anchor="middle" letter-spacing="6">&amp; FITNESS</text>
</svg>
